<html><body><main><h1>Výběrové řízení na pronájem bytu Minská 20</h1>
<p>Městská část nabízí k pronájmu byt 2+kk o výměře 48,5 m2 ve 3. NP, dům s výtahem. Minimální výše nabídky nájemného 180 Kč/m2.
Prohlídka bytu se uskuteční dne 25. 11. 2026 v 15:30 hod. Nabídky lze podávat do 2. 12. 2026 obálkovou metodou.</p>
