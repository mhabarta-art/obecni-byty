name: Kontrola nabídek bytů

on:
  schedule:
    - cron: "17 5 * * *"   # UTC → 6:17 SEČ (v létě 7:17)
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Uložit HTML snapshoty zdrojů do data/debug (diagnostika parserů)"
        type: boolean
        default: false
      no_email:
        description: "Neposílat e-mail"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Stáhnout a zpracovat nabídky
        run: python -m scraper.main ${{ inputs.snapshots && '--snapshots' || '' }} ${{ inputs.no_email && '--no-email' || '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          APP_URL: ${{ vars.APP_URL }}
      - name: Uložit data
        run: |
          git config user.name "obecni-byty-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: aktualizace $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet   # the Mac may have pushed a fresh Žabovřesky RSS meanwhile
          git push

  deploy:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sestavit web
        run: |
          mkdir -p _site/data
          cp web/index.html _site/
          cp data/*.json _site/data/
          if [ -n "$MAPY_API_KEY" ]; then sed -i "s|__MAPY_API_KEY__|${MAPY_API_KEY}|" _site/index.html; fi
        env:
          MAPY_API_KEY: ${{ vars.MAPY_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
